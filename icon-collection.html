<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soft UI Icon Collection</title>
    <style>
      :root {
        --ink: #242424;
        --edge-light: #f1f1f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #e6e6e6 0%, #d4d4d4 45%, #c9c9c9 100%);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .panel {
        width: min(360px, 88vw);
        padding: 16px 12px;
        border-radius: 36px;
        background: linear-gradient(160deg, #dedede, #c9c9c9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.75),
          inset 0 -1px 0 rgba(120, 120, 120, 0.35),
          0 8px 22px rgba(50, 50, 50, 0.15);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .tile {
        aspect-ratio: 1 / 1;
        border-radius: 28px;
        border: 0;
        background: linear-gradient(165deg, #efefef 0%, #dddddd 45%, #cecece 100%);
        box-shadow:
          inset 0 1.5px 0 var(--edge-light),
          inset 0 -1.8px 0 rgba(120, 120, 120, 0.55),
          0 0 0 1px rgba(118, 118, 118, 0.65),
          0 2px 4px rgba(50, 50, 50, 0.2);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .tile:hover {
        transform: translateY(-1px);
      }

      .tile:active {
        transform: translateY(1px);
        box-shadow:
          inset 0 2.5px 4px rgba(120, 120, 120, 0.35),
          0 0 0 1px rgba(118, 118, 118, 0.65);
      }

      .tile svg {
        width: 46%;
        height: 46%;
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tile .dot {
        fill: var(--ink);
        stroke: none;
      }
    </style>
  </head>
  <body>
    <main class="panel" aria-label="Icon button collection">
      <button class="tile" aria-label="Messages">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="8" y="9" width="32" height="23" rx="4" ry="4"></rect>
          <path d="M19 32l5 7 5-7"></path>
          <circle cx="17" cy="20" r="1.6" class="dot"></circle>
          <circle cx="24" cy="20" r="1.6" class="dot"></circle>
          <circle cx="31" cy="20" r="1.6" class="dot"></circle>
        </svg>
      </button>

      <button class="tile" aria-label="Orbit">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="10"></circle>
          <ellipse cx="24" cy="24" rx="19" ry="7" transform="rotate(-30 24 24)"></ellipse>
        </svg>
      </button>

      <button class="tile" aria-label="Health">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 37s-12-7.4-12-15c0-4.3 3.1-8 7.7-8 2.3 0 4.5 1.1 5.9 3.1 1.4-2 3.6-3.1 5.9-3.1 4.6 0 7.7 3.7 7.7 8 0 7.6-12 15-12 15z"></path>
          <path d="M13 24h8l3-4 4 8 3-4h4"></path>
        </svg>
      </button>

      <button class="tile" aria-label="Server">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="11" y="11" width="26" height="10" rx="2"></rect>
          <rect x="11" y="27" width="26" height="10" rx="2"></rect>
          <circle cx="31" cy="16" r="1.4" class="dot"></circle>
          <circle cx="31" cy="32" r="1.4" class="dot"></circle>
        </svg>
      </button>

      <button class="tile" aria-label="Shield">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 8l12 5v9c0 8.5-4.7 13.1-12 17-7.3-3.9-12-8.5-12-17v-9l12-5z"></path>
          <path d="M18.5 24l4 4 7-8"></path>
        </svg>
      </button>

      <button class="tile" aria-label="Wi-Fi">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 20c7.3-7.3 20.7-7.3 28 0"></path>
          <path d="M15 25c4.5-4.5 13.5-4.5 18 0"></path>
          <path d="M20 30c2-2 6-2 8 0"></path>
          <circle cx="24" cy="35" r="1.7" class="dot"></circle>
        </svg>
      </button>
    </main>
  </body>
</html>
